<div id="dragon-boardgame-flow" aria-label="龙城桌游库流程预览">
<style>
#dragon-boardgame-flow{--dr-page:#FFFFFF;--dr-panel:#FFFFFF;--dr-form:#F5F5F5;--dr-text:#111827;--dr-muted:#4B5563;--dr-line:#E5E7EB;--dr-accent:#FF9800;--dr-accent-text:#7C3A05;--dr-soft:#FFF3E0;--dr-on:#FFFFFF;--dr-danger:#995B32;--dr-mask:rgba(0,0,0,.4);--dr-drawer-low:360;--dr-drawer-standard:558;--dr-drawer-high:720;color:var(--dr-text);font:400 14px/22px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:390px;margin:auto;color-scheme:light;}
/* Layout styles. Palette and drawer tiers come from design-system/tokens.json. */
#dragon-boardgame-flow *{box-sizing:border-box;}
#dragon-boardgame-flow button,#dragon-boardgame-flow input,#dragon-boardgame-flow select,#dragon-boardgame-flow textarea{font:inherit;color:inherit;}
#dragon-boardgame-flow button{cursor:pointer;}
#dragon-boardgame-flow button:disabled{opacity:.45;cursor:default;}
#dragon-boardgame-flow .dr-demo{font-size:12px;color:var(--dr-muted);text-align:center;margin-bottom:10px;}
#dragon-boardgame-flow .dr-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;height:56px;background:var(--dr-panel);gap:10px;}
#dragon-boardgame-flow .dr-head strong{font-size:20px;font-weight:700;}
#dragon-boardgame-flow .dr-head button{background:none;border:0;padding:8px 0;min-height:40px;color:var(--dr-accent);}
#dragon-boardgame-flow .dr-h h2{font-size:20px;font-weight:700;margin:0;}
#dragon-boardgame-flow .dr-h button{border:0;background:none;color:var(--dr-accent);padding:8px 0;}
#dragon-boardgame-flow .dr-search{width:100%;height:40px;border:1px solid var(--dr-line);border-radius:14px;background:var(--dr-panel);padding:0 12px;font-size:16px;}
#dragon-boardgame-flow .dr-recent{background:var(--dr-soft);padding:20px;border-radius:20px;display:flex;align-items:center;gap:18px;}
#dragon-boardgame-flow .dr-recent img{width:88px;height:108px;object-fit:cover;border-radius:6px;transform:rotate(-6deg);box-shadow:0 7px 10px rgba(0,0,0,.15);}
#dragon-boardgame-flow .dr-recent strong{font-size:20px;font-weight:700;display:block;}
#dragon-boardgame-flow .dr-muted{color:var(--dr-muted);font-size:12px;}
#dragon-boardgame-flow .dr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
#dragon-boardgame-flow .dr-nav{display:flex;gap:6px;border-top:1px solid var(--dr-line);background:var(--dr-panel);padding:10px 12px 16px;}
#dragon-boardgame-flow .dr-nav button{flex:1;border:0;border-radius:12px;background:none;color:var(--dr-muted);padding:8px 4px;min-height:44px;}
#dragon-boardgame-flow .dr-nav button[aria-pressed=true]{background:var(--dr-soft);color:var(--dr-accent);}
#dragon-boardgame-flow .dr-row>*{min-width:0;}
#dragon-boardgame-flow .dr-primary{background:var(--dr-accent);color:var(--dr-on);border-color:var(--dr-accent);}
#dragon-boardgame-flow .dr-block{width:100%;}
#dragon-boardgame-flow .dr-tabs button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--dr-muted);padding:6px 4px;}
#dragon-boardgame-flow .dr-tabs button[aria-pressed=true]{background:var(--dr-panel);color:var(--dr-text);}
#dragon-boardgame-flow .dr-section{background:var(--dr-panel);border:1px solid var(--dr-line);border-radius:16px;padding:14px;margin-bottom:12px;}
#dragon-boardgame-flow .dr-section>p:first-child{margin-top:0;}
#dragon-boardgame-flow .dr-section>p:last-child{margin-bottom:0;}
#dragon-boardgame-flow .dr-hero{display:flex;gap:16px;align-items:center;margin-bottom:20px;}
#dragon-boardgame-flow .dr-hero img{width:100px;height:128px;object-fit:cover;border-radius:10px;}
#dragon-boardgame-flow .dr-hero h2{font-size:20px;font-weight:700;margin:0 0 10px;}
#dragon-boardgame-flow .dr-hero div{min-width:0;}
#dragon-boardgame-flow .dr-ruleline{margin:12px 0;border-top:1px solid var(--dr-line);}
#dragon-boardgame-flow .dr-line{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:12px;border-bottom:1px solid var(--dr-line);}
#dragon-boardgame-flow .dr-line:last-child{border-bottom:0;}
#dragon-boardgame-flow .dr-avatar{width:30px;height:30px;border-radius:50%;background:var(--dr-soft);color:var(--dr-accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;}
#dragon-boardgame-flow .dr-person{display:flex;align-items:center;gap:8px;min-width:0;}
#dragon-boardgame-flow .dr-person span{overflow-wrap:anywhere;}
#dragon-boardgame-flow .dr-scorebox{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;max-width:180px;}
#dragon-boardgame-flow .dr-scorebox input{width:68px;background:var(--dr-form);border:0;padding:9px 5px;border-radius:8px;text-align:center;font-size:16px;}
#dragon-boardgame-flow .dr-status{background:none;border:0;color:var(--dr-accent);padding:8px 0;min-height:40px;font-size:12px;}
#dragon-boardgame-flow .dr-field{display:block;margin:14px 0;}
#dragon-boardgame-flow .dr-field>span{display:block;margin-bottom:6px;font-size:12px;color:var(--dr-muted);}
#dragon-boardgame-flow .dr-field input,#dragon-boardgame-flow .dr-field select,#dragon-boardgame-flow .dr-field textarea{width:100%;border:1px solid var(--dr-line);border-radius:10px;background:var(--dr-panel);padding:10px;font-size:16px;}
#dragon-boardgame-flow .dr-bottom{display:flex;gap:10px;min-height:80px;padding:14px 18px 20px;background:var(--dr-panel);}
#dragon-boardgame-flow .dr-bottom button{flex:1;}
#dragon-boardgame-flow .dr-mask{position:absolute;inset:0;background:var(--dr-mask);display:flex;align-items:flex-end;z-index:4;}
#dragon-boardgame-flow .dr-option{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--dr-line);background:var(--dr-panel);min-height:52px;padding:10px 0;text-align:left;}
#dragon-boardgame-flow .dr-option:last-child{border-bottom:0;}
#dragon-boardgame-flow .dr-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0;}
#dragon-boardgame-flow .dr-metrics>div{padding:0 4px;}
#dragon-boardgame-flow .dr-bar{height:9px;background:var(--dr-form);border-radius:5px;margin:7px 0;}
#dragon-boardgame-flow .dr-bar span{display:block;height:100%;background:var(--dr-accent);border-radius:5px;}
#dragon-boardgame-flow table{width:100%;border-collapse:collapse;font-size:14px;}
#dragon-boardgame-flow th{font-weight:400;color:var(--dr-muted);font-size:12px;}
#dragon-boardgame-flow td,#dragon-boardgame-flow th{padding:10px 5px;text-align:left;border-bottom:1px solid var(--dr-line);}
#dragon-boardgame-flow .dr-quiet{background:none;border:0;color:var(--dr-accent);padding:5px 0;}
#dragon-boardgame-flow .dr-empty{padding:48px 18px;text-align:center;color:var(--dr-muted);}
#dragon-boardgame-flow .dr-alert{background:var(--dr-soft);color:var(--dr-accent);border-radius:10px;padding:10px 12px;font-size:12px;}
#dragon-boardgame-flow .dr-summary{padding:12px 0;white-space:normal;overflow-wrap:anywhere;}
#dragon-boardgame-flow .dr-check{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--dr-line);}
#dragon-boardgame-flow input[type=checkbox]{width:20px;height:20px;accent-color:var(--dr-accent);}
#dragon-boardgame-flow [hidden]{display:none!important;}
@media(max-width:350px){#dragon-boardgame-flow .dr-scorebox{max-width:134px;}#dragon-boardgame-flow .dr-scorebox input{width:54px;}#dragon-boardgame-flow .dr-screen{padding:12px;}#dragon-boardgame-flow .dr-grid{gap:8px;}#dragon-boardgame-flow .dr-game img{height:125px;}#dragon-boardgame-flow .dr-hero img{width:84px;height:108px;}}
#dragon-boardgame-flow .dr-collection{text-align:center;padding:28px 14px;}
#dragon-boardgame-flow .dr-timer{font-size:32px;font-variant-numeric:tabular-nums;color:var(--dr-accent);}
#dragon-boardgame-flow .dr-paper{background:var(--dr-panel);border:1px solid var(--dr-line);border-radius:12px;padding:8px;overflow:hidden;}
#dragon-boardgame-flow .dr-paper-row{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--dr-line);}
#dragon-boardgame-flow .dr-paper-row input{width:100%;min-width:0;padding:8px 3px;text-align:center;border:1px solid var(--dr-line);background:var(--dr-form);border-radius:6px;}
#dragon-boardgame-flow .dr-paper-row strong{font-weight:500;text-align:center;}
#dragon-boardgame-flow .dr-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
#dragon-boardgame-flow .dr-compare>div{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--dr-form);border-radius:10px;}
#dragon-boardgame-flow .dr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
#dragon-boardgame-flow .dr-phone{position:relative;background:var(--dr-page);border:0;border-radius:24px;overflow:hidden;min-height:844px;display:flex;flex-direction:column;}
#dragon-boardgame-flow .dr-head strong,#dragon-boardgame-flow .dr-h h2{font-size:20px;line-height:28px;font-weight:700;}
#dragon-boardgame-flow .dr-screen{padding:16px;flex:1;min-height:520px;background:var(--dr-page);}
#dragon-boardgame-flow .dr-muted,#dragon-boardgame-flow .dr-demo{font-size:12px;line-height:18px;}
#dragon-boardgame-flow .dr-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px;flex-wrap:wrap;}
#dragon-boardgame-flow .dr-head button,#dragon-boardgame-flow .dr-h button,#dragon-boardgame-flow .dr-status,#dragon-boardgame-flow .dr-quiet{color:var(--dr-accent-text);}
#dragon-boardgame-flow .dr-game{padding:0;text-align:left;background:var(--dr-panel);border:1px solid var(--dr-line);border-radius:16px;overflow:hidden;min-width:0;height:230px;display:flex;flex-direction:column;}
#dragon-boardgame-flow .dr-game img{width:100%;height:0;object-fit:cover;display:block;flex:1;min-height:0;}
#dragon-boardgame-flow .dr-game .dr-booktext{padding:8px;flex:none;}
#dragon-boardgame-flow .dr-game strong{display:block;font-weight:500;overflow-wrap:anywhere;min-height:22px;font-size:14px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#dragon-boardgame-flow .dr-game .dr-muted{margin-top:8px;}
#dragon-boardgame-flow .dr-tag{display:inline-block;border-radius:8px;background:var(--dr-soft);color:var(--dr-accent-text);padding:3px 7px;font-size:12px;}
#dragon-boardgame-flow .dr-number{font-size:32px;font-weight:700;display:block;font-variant-numeric:tabular-nums;line-height:40px;color:var(--dr-text);}
#dragon-boardgame-flow .dr-button{border:1px solid var(--dr-line);border-radius:12px;background:var(--dr-panel);padding:10px 14px;min-height:44px;font-size:14px;line-height:22px;}
#dragon-boardgame-flow .dr-tabs{display:flex;background:var(--dr-form);padding:4px;border-radius:12px;gap:4px;margin-bottom:16px;}
#dragon-boardgame-flow .dr-sheet{background:var(--dr-form);border-radius:24px 24px 0 0;width:100%;padding:0 16px;max-height:calc(100% - 124px);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 -5px 18px #414A8A14;}
#dragon-boardgame-flow .dr-sheet.dr-form-sheet{background:var(--dr-form);padding:0 18px;}
#dragon-boardgame-flow .dr-handle{height:12px;display:flex;justify-content:center;align-items:center;margin-top:8px;margin-bottom:8px;flex:none;}
#dragon-boardgame-flow .dr-handle:after{content:'';width:38px;height:4px;border-radius:2px;background:#9CA3AF;}
#dragon-boardgame-flow .dr-sheet-heading{height:40px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;}
#dragon-boardgame-flow .dr-sheet h3{font-size:20px;font-weight:700;height:auto;display:block;align-items:center;margin:0;min-width:0;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#dragon-boardgame-flow .dr-sheet-close{display:flex;align-items:center;justify-content:center;flex:none;border:0;background:transparent;color:var(--dr-muted);width:32px;height:32px;padding:0;font-size:20px;line-height:28px;}
#dragon-boardgame-flow .dr-sheet-content{min-height:0;overflow:auto;flex:1;padding-bottom:16px;}
#dragon-boardgame-flow .dr-sheet:not(.dr-form-sheet) .dr-sheet-content{background:var(--dr-panel);border-radius:16px;padding:0 12px 16px;}
#dragon-boardgame-flow .dr-sheet>.dr-bottom{flex:none;height:80px;min-height:80px;align-items:center;margin:0 -16px;padding:12px 16px 24px;background:var(--dr-panel);}
#dragon-boardgame-flow .dr-form-sheet>.dr-bottom{margin:0 -18px;padding-left:18px;padding-right:18px;}
#dragon-boardgame-flow .dr-sheet .dr-option{padding:12px 0;font-size:14px;line-height:22px;min-height:48px;}
#dragon-boardgame-flow .dr-sheet .dr-check{padding:12px;background:var(--dr-panel);border-radius:12px;margin:8px 0;}
#dragon-boardgame-flow .dr-sheet .dr-field input,#dragon-boardgame-flow .dr-sheet .dr-field select,#dragon-boardgame-flow .dr-sheet .dr-field textarea{border-radius:12px;}
#dragon-boardgame-flow .dr-sheet-content>.dr-alert{margin:0 0 12px;}
#dragon-boardgame-flow .dr-alert,#dragon-boardgame-flow .dr-nav button[aria-pressed=true]{color:var(--dr-accent-text);}
</style>

<script>
/* FLOW_SOURCE_START */

  const root = document.getElementById('dragon-boardgame-flow');
  const screen = root.querySelector('.dr-screen'), overlay = root.querySelector('[data-overlay]'), bottom = root.querySelector('[data-bottom]');
  const covers = JSON.parse(document.getElementById('dragon-game-covers').textContent);
  const games = [
    {id:1,name:'工业革命：伯明翰',en:'Brass: Birmingham',players:'2–4 人',time:'60–120 分钟',cover:covers.brass,owned:true,available:true},
    {id:2,name:'火星改造计划',en:'Terraforming Mars',players:'1–5 人',time:'120 分钟',cover:covers.mars,owned:false,available:false}
  ];
  const members = [{id:1,name:'小李（我）',short:'李'},{id:2,name:'小陈',short:'陈'},{id:3,name:'小赵',short:'赵'},{id:4,name:'小吴',short:'吴'}];
  const activities = [{id:1,name:'周末桌游局',date:'2026-09-13'},{id:2,name:'月末聚会',date:'2026-08-23'}];
  const labels = {unrecorded:'未填写',recorded:'已记分',gave_up:'摆烂不算分了',unfinished:'没开完',table_flip:'掀桌了'};
  const modes = {individual:'个人竞技',team:'团队竞技',cooperative:'合作',solo:'单人',unscored:'只记游玩'};
  const fresh = () => ({game:1,selected:[1,2,3],scores:{1:'78',2:'0',3:''},statuses:{1:'recorded',2:'recorded',3:'unrecorded'},teams:{1:1,2:2,3:1,4:2},teamScores:{1:'80',2:'60'},teamStatuses:{1:'recorded',2:'recorded'},sharedScore:'',sharedStatus:'unrecorded',sharedResult:'unknown',mode:'individual',end:'completed',date:'2026-09-13',activity:1,expanded:false,draft:false,resultMethod:'score',winnerIds:[],resultReason:''});
  const records = [
    {...fresh(),id:1,date:'2026-09-06',scores:{1:'78',2:'62',3:'54'},statuses:{1:'recorded',2:'recorded',3:'recorded'}},
    {...fresh(),id:2,game:2,date:'2026-08-23',activity:2,scores:{1:'',2:'',3:''},statuses:{1:'unrecorded',2:'unrecorded',3:'unrecorded'}},
    {...fresh(),id:3,date:'2026-07-12',activity:0,selected:[2,3],scores:{2:'82',3:'72'},statuses:{2:'recorded',3:'recorded'}}
  ];
  const nominations = [{game:1,activity:1,people:[2,3,4]},{game:2,activity:2,people:[1,2]}];
  const state = {page:'library',game:1,detail:'info',scope:'all',period:'quarter',activityIds:[],gameFilter:null,start:'2026-07-01',end:'2026-09-30',owned:false,available:false,search:'',recent:true,checked:true,organizer:false,started:false,imported:false,mappings:{},selectedRecord:1};
  let form = fresh(), stack = [], draftSelection = [], nominateAction = 'nominate', previousFocus;
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const game = id => games.find(g => g.id === id) || games[0];
  const member = id => members.find(m => m.id === id);
  const activityName = id => activities.find(a => a.id === id)?.name || '独立记录';
  const button = (label, action, extra='') => `<button type="button" class="dr-button" data-action="${action}" ${extra}>${label}</button>`;
  const primary = (label, action) => `<button type="button" class="dr-button dr-primary" data-action="${action}">${label}</button>`;
  const titleRow = (name, action, label) => `<div class="dr-h"><h2>${name}</h2>${action?`<button type="button" data-action="${action}">${label}</button>`:''}</div>`;
  const tabs = (items, selected, attr) => `<div class="dr-tabs">${items.map(([v,n])=>`<button type="button" ${attr}="${v}" aria-pressed="${selected===v}">${n}</button>`).join('')}</div>`;
  function close() { overlay.hidden=true;overlay.innerHTML='';root.querySelector('.dr-screen').inert=false;root.querySelector('.dr-head').inert=false;root.querySelector('.dr-nav').inert=false;bottom.inert=false;if(previousFocus?.isConnected)previousFocus.focus(); }
  function navigate(page) { if(page!==state.page)stack.push(state.page);state.page=page;close();render(); }
  function sheet(title, content, isForm=false, actions='') {
    previousFocus=document.activeElement;
    overlay.hidden=false;
    overlay.innerHTML=`<div class="dr-mask"><section class="dr-sheet ${isForm?'dr-form-sheet':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dr-handle"></div><div class="dr-sheet-heading"><h3>${title}</h3><button type="button" class="dr-sheet-close" data-action="close" aria-label="关闭">×</button></div><div class="dr-sheet-content">${content}</div>${actions?`<div class="dr-bottom">${actions}</div>`:''}</section></div>`;
    const panel=overlay.querySelector('.dr-sheet'), view=overlay.querySelector('.dr-sheet-content');
    const styles=getComputedStyle(root),required=76+view.scrollHeight+(actions?80:0)+16;
    const tiers=['low','standard','high'].map(t=>Number.parseFloat(styles.getPropertyValue('--dr-drawer-'+t)));
    panel.style.height=(tiers.find(h=>h>=required)||tiers[2])+'px';
    screen.inert=true;root.querySelector('.dr-head').inert=true;root.querySelector('.dr-nav').inert=true;bottom.inert=true;
    overlay.querySelector('button,input,select')?.focus();
  }
  function error(text) { const target=overlay.hidden?screen:overlay.querySelector('.dr-sheet-content');target.querySelector('[role=alert]')?.remove();const el=document.createElement('p');el.className='dr-alert';el.setAttribute('role','alert');el.textContent=text;target.prepend(el); }
  function personalResult(p,id) {
    if(p.end!=='completed')return '未完成';
    if(p.mode==='unscored')return '已参局';
    if(p.statuses[id]==='gave_up')return '未获胜';
    if(['unfinished','table_flip'].includes(p.statuses[id]))return '结果待补';
    if(['cooperative','solo'].includes(p.mode))return p.sharedStatus==='gave_up'||p.sharedResult==='failure'?'未获胜':p.sharedResult==='success'?'获胜':'结果待补';
    const team=p.mode==='team', ids=team?[...new Set(p.selected.map(x=>p.teams[x]))]:p.selected;
    const statuses=team?p.teamStatuses:p.statuses, scores=team?p.teamScores:p.scores, key=team?p.teams[id]:id;
    if(statuses[key]==='gave_up')return '未获胜';
    if(['unfinished','table_flip'].includes(statuses[key]))return '结果待补';
    if(p.resultMethod&&p.resultMethod!=='score')return (p.winnerIds||[]).includes(Number(key))?'获胜':'未获胜';
    const eligible=ids.filter(x=>statuses[x]!=='gave_up');
    if(eligible.some(x=>statuses[x]!=='recorded'||scores[x]===''))return '结果待补';
    return Number(scores[key])===Math.max(...eligible.map(x=>Number(scores[x])))?'获胜':'未获胜';
  }
  function summary(p) {
    if(p.end!=='completed')return `${p.end==='table_flip'?'掀桌结束':'没开完'} · 保留记录，不计完成局数和胜率`;
    if(p.mode==='unscored')return '保留游玩次数，不产生胜率或分数排名';
    const n=p.selected.filter(id=>p.statuses[id]==='gave_up').length;
    return n?`${n} 位成员摆烂，计为未获胜；分数保持空值`:'未填写保持空值，0 分单独记录；结果未知时不计胜率';
  }
  function inRange(date) { const start={month:'2026-09-01',quarter:'2026-07-01',year:'2026-01-01',all:'0000-01-01',custom:state.start}[state.period];return date>=start&&date<=({month:'2026-09-30',quarter:'2026-09-30',year:'2026-12-31',all:'9999-12-31',custom:state.end}[state.period]); }
  function filtered(gameId=state.gameFilter) { return records.filter(p=>inRange(p.date)&&(!state.activityIds.length||state.activityIds.includes(p.activity))&&(state.scope!=='mine'||p.selected.includes(1))&&(!gameId||p.game===gameId)); }
  function scoreBox(unit,id,name,p=form) {
    const status=unit==='shared'?p.sharedStatus:unit==='team'?p.teamStatuses[id]:p.statuses[id];
    const value=unit==='shared'?p.sharedScore:unit==='team'?p.teamScores[id]:p.scores[id];
    return `<div class="dr-scorebox"><input type="number" step="0.000001" data-score="${id}" data-unit="${unit}" aria-label="${esc(name)}的分数" placeholder="未填" value="${esc(value)}" ${!['recorded','unrecorded'].includes(status)?'disabled':''}><button type="button" class="dr-status" data-score-state="${id}" data-unit="${unit}" aria-label="${esc(name)}的成绩状态">${labels[status]} ▾</button></div>`;
  }
  function playerEditor() {
    const team=form.mode==='team', shared=['cooperative','solo'].includes(form.mode), unscored=form.mode==='unscored';

  function filterBar() { return `<div class="dr-row" style="margin-bottom:12px"><select class="dr-button" aria-label="时间范围" data-period>${[['month','本月'],['quarter','本季度'],['year','本年'],['all','全部时间'],['custom','自定义']].map(([v,n])=>`<option value="${v}" ${state.period===v?'selected':''}>${n}</option>`).join('')}</select>${button(state.activityIds.length?`${state.activityIds.length} 场活动`:'全部活动','activity-filter')}</div>${state.period==='custom'?`<p class="dr-muted">${state.start} 至 ${state.end}</p>`:''}${state.gameFilter?`<div class="dr-row dr-summary"><span>${esc(game(state.gameFilter).name)}</span>${button('清除桌游','clear-game-filter')}</div>`:''}`; }

  function renderStats() {
    const completed=filtered().filter(p=>!p.draft&&p.end==='completed');

    const wanted=nominations.filter(n=>inRange(activities.find(a=>a.id===n.activity).date)&&(!state.activityIds.length||state.activityIds.includes(n.activity))&&(!state.gameFilter||state.gameFilter===n.game)&&(state.scope!=='mine'||n.people.includes(1)));

    return tabs([['all','全体'],['mine','我的']],state.scope,'data-scope')+filterBar()+`<div class="dr-section"><div class="dr-muted">${state.scope==='mine'?'我的':'全体'}已完成对局</div><div class="dr-metrics">${[[completed.length,'局'],[new Set(completed.map(p=>p.game)).size,'款游戏'],[new Set(completed.map(p=>p.date)).size,'游玩日']].map(([n,s])=>`<div><span class="dr-number">${n}</span><span class="dr-muted">${s}</span></div>`).join('')}</div></div>`+titleRow('开的最多')+`<div class="dr-section">${ranking.length?ranking.map(({g,count})=>`<button type="button" class="dr-option" data-drill="${g.id}"><span>${esc(g.name)}</span><span>${count} 局 ›</span></button><div class="dr-bar"><span style="width:${count/ranking[0].count*100}%"></span></div>`).join(''):'暂无完成对局'}</div>`+titleRow('最想开')+`<div class="dr-section">${wantedGroups.length?wantedGroups.map(({g,rows,count})=>`<button type="button" class="dr-option" data-action="activity"><span>${esc(g.name)}<span class="dr-muted" style="display:block">来自 ${rows.length} 场活动</span></span><span>${count} ${state.scope==='mine'?'次':'人次'} ›</span></button>`).join(''):'这个范围内暂无提名'}</div>`+titleRow('单款成绩')+`<div class="dr-section"><label class="dr-field"><span>桌游 · 个人竞技</span><select data-stats-game>${games.map(g=>`<option value="${g.id}" ${g.id===state.game?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><table><thead><tr><th>玩家</th><th>获胜 / 有效局</th><th>胜率</th></tr></thead><tbody>${personal.map(({m,n,wins})=>`<tr><td>${m.name}</td><td>${wins} / ${n}</td><td>${Math.round(wins/n*100)}%</td></tr>`).join('')||'<tr><td colspan="3">暂无结果明确的对局</td></tr>'}</tbody></table><p class="dr-muted">摆烂计未获胜；未完成整局不进入分母。</p>${button('查看趋势','insights')}</div>`;
  }

    } else if(state.page==='activity') {
      const selected=nominations.filter(n=>n.activity===1);
      screen.innerHTML=`<div class="dr-section"><span class="dr-tag">${state.started?'已开始':'报名中'}</span><h2>周末桌游局</h2><div class="dr-muted">9 月 13 日 · 14:00–19:00</div><p>开场前可以修改自己的提名。</p></div>`+titleRow('大家想玩',state.started?null:'pick-nomination','提名桌游')+selected.map(n=>`<div class="dr-section"><div class="dr-row"><strong>${esc(game(n.game).name)}</strong><span>${n.people.length} 人</span></div><p class="dr-muted">${n.people.map(id=>member(id).name).join('、')}</p><button type="button" class="dr-button dr-block" data-vote="${n.game}" ${state.started?'disabled':''}>${state.started?'提名已截止':n.people.includes(1)?'已提名 · 点此修改':'我也想玩'}</button></div>`).join('')+titleRow('游戏安排',state.organizer?'add-plan':null,'加一桌')+`<div class="dr-section"><div class="dr-row"><strong>1 号桌</strong><span class="dr-muted">小陈携带</span></div><p>${esc(game(state.game).name)}</p>${button(state.checked||state.organizer?'记录这桌的对局':'打卡后可记录','activity-play',state.checked||state.organizer?'':'disabled')}</div>`;
    } else if(state.page==='editor') {
      screen.innerHTML=`<div class="dr-section"><strong>${esc(game(form.game).name)}</strong><div class="dr-muted">${form.date} · ${activityName(form.activity)}</div>${form.game===2?`<label class="dr-check"><input type="checkbox" data-expansion ${form.expanded?'checked':''}>加入「序曲」扩展</label>`:''}</div><label class="dr-field"><span>比赛方式</span><select data-mode>${Object.entries(modes).map(([v,n])=>`<option value="${v}" ${form.mode===v?'selected':''}>${n}</option>`).join('')}</select></label>`+titleRow('实际玩家','players','选择用户')+playerEditor()+`<label class="dr-field"><span>整局是否完成</span><select data-end>${[['completed','已完成'],['unfinished','没开完'],['table_flip','掀桌结束']].map(([v,n])=>`<option value="${v}" ${form.end===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="dr-alert" data-result-summary aria-live="polite">${summary(form)}</div>`;bottom.hidden=false;bottom.innerHTML=button('存为草稿','save-draft')+primary('保存对局','save-play');

    } else if(state.page==='playdetail') {
      const p=records.find(x=>x.id===state.selectedRecord);
      screen.innerHTML=`<div class="dr-section"><span class="dr-tag">${p.draft?'草稿':p.end==='completed'?'已完成':'未完成'}</span><h2>${esc(game(p.game).name)}</h2><div class="dr-muted">${p.date} · ${activityName(p.activity)} · ${modes[p.mode]}</div></div><div class="dr-section">${p.selected.map(id=>{const status=p.statuses[id];let score=status==='recorded'?`${esc(p.scores[id])} 分`:labels[status];if(p.mode==='unscored')score='已参局';else if(p.mode==='team'&&status!=='gave_up')score=`${p.teams[id]} 队 · ${p.teamStatuses[p.teams[id]]==='recorded'?p.teamScores[p.teams[id]]+' 分':labels[p.teamStatuses[p.teams[id]]]}`;else if(['cooperative','solo'].includes(p.mode)&&status!=='gave_up')score=p.sharedStatus==='recorded'?'共同 '+p.sharedScore+' 分':labels[p.sharedStatus];return `<div class="dr-line"><div class="dr-person"><span class="dr-avatar">${member(id).short}</span><span>${member(id).name}</span></div><div style="text-align:right"><span>${score}</span><div class="dr-muted">${p.draft?'草稿，不计统计':personalResult(p,id)}</div></div></div>`;}).join('')}</div><div class="dr-alert">${summary(p)}</div><p class="dr-muted">由小李记录 · 名单和成绩可更正</p>`;bottom.hidden=false;bottom.innerHTML=button('更正记录','edit-play')+primary('查看统计','stats');

      screen.innerHTML=`<div class="dr-alert">保留来源中的玩家名称，逐个匹配小程序用户。</div>${titleRow('玩家对应')}<div class="dr-section">${['Li','Chen','未匹配玩家'].map((n,i)=>`<label class="dr-field"><span>来源玩家 · ${n}</span><select data-map="${i}"><option value="">暂不匹配</option>${members.map(m=>`<option value="${m.id}" ${state.mappings[i]===String(m.id)?'selected':''}>${m.name}</option>`).join('')}</select></label>`).join('')}</div><p class="dr-muted">同名不会自动绑定账号。原始资料保留，之后可以再调整。</p>`;bottom.hidden=false;bottom.innerHTML=button('稍后处理','imports')+primary('保存匹配并暂存','confirm-import');

  function chooseStatus(id,unit) {
    const status=unit==='shared'?form.sharedStatus:unit==='team'?form.teamStatuses[id]:form.statuses[id];
    const name=unit==='shared'?'共同':unit==='team'?id+' 队':member(Number(id)).name;
    const options=unit==='player'&&['team','cooperative','solo'].includes(form.mode)?Object.entries(labels).filter(([v])=>v!=='recorded'):Object.entries(labels);
    sheet(name+'的成绩',options.map(([v,n])=>`<button type="button" class="dr-option" data-select-state="${v}" data-subject="${id}" data-unit="${unit}"><span>${n}</span><span>${v===status?'✓':''}</span></button>`).join(''));
  }
  function save(draft) {
    if(!form.selected.length)return error('至少选择一位实际玩家');
    if(form.mode==='solo'&&form.selected.length!==1)return error('单人模式只能选择一位玩家');
    if(form.mode==='team'&&new Set(form.selected.map(id=>form.teams[id])).size<2)return error('团队竞技至少需要两队');
    for(const id of form.selected)if(form.statuses[id]==='recorded'&&form.scores[id]==='')form.statuses[id]='unrecorded';
    for(const id of [1,2])if(form.teamStatuses[id]==='recorded'&&form.teamScores[id]==='')form.teamStatuses[id]='unrecorded';
    if(form.sharedStatus==='recorded'&&form.sharedScore==='')form.sharedStatus='unrecorded';
    if(form.mode==='solo'&&form.statuses[form.selected[0]]==='gave_up')form.sharedResult='failure';
    if(!draft&&form.resultMethod&&form.resultMethod!=='score'&&(!form.winnerIds.length||!form.resultReason.trim()))return error('请指定赢家并填写结果说明');
    const id=form.id||Math.max(...records.map(p=>p.id))+1, p=JSON.parse(JSON.stringify({...form,id,draft}));
    const i=records.findIndex(x=>x.id===id);if(i<0)records.push(p);else records[i]=p;
    state.selectedRecord=id;state.game=p.game;navigate('playdetail');
  }
  root.addEventListener('click',e=>{
    if(e.target.classList.contains('dr-mask'))return close();
    const t=e.target.closest('button');if(!t||t.disabled)return;
    if(t.dataset.page){state.gameFilter=null;return navigate(t.dataset.page);}
    if(t.dataset.game){state.game=Number(t.dataset.game);state.detail='info';return navigate('detail');}
    if(t.dataset.detail){state.detail=t.dataset.detail;return render();}
    if(t.dataset.scope){state.scope=t.dataset.scope;return render();}
    if(t.dataset.drill){state.gameFilter=Number(t.dataset.drill);return navigate('plays');}
    if(t.dataset.record){state.selectedRecord=Number(t.dataset.record);return navigate('playdetail');}
    if(t.dataset.scoreState)return chooseStatus(t.dataset.scoreState,t.dataset.unit);
    if(t.dataset.selectState){const {unit,subject,selectState}=t.dataset;if(unit==='shared'){form.sharedStatus=selectState;if(selectState!=='recorded')form.sharedScore='';if(selectState==='gave_up')form.sharedResult='failure';}else{(unit==='team'?form.teamStatuses:form.statuses)[subject]=selectState;if(selectState!=='recorded')(unit==='team'?form.teamScores:form.scores)[subject]='';}close();return render();}
    if(t.dataset.vote){const n=nominations.find(n=>n.game===Number(t.dataset.vote)&&n.activity===1);if(n.people.includes(1))return sheet('我的提名',button('保留提名','close')+` <button type="button" class="dr-button" data-withdraw="${n.game}">撤回提名</button>`);n.people.push(1);return render();}
    if(t.dataset.withdraw){nominations.find(n=>n.game===Number(t.dataset.withdraw)&&n.activity===1).people=nominations.find(n=>n.game===Number(t.dataset.withdraw)&&n.activity===1).people.filter(id=>id!==1);close();return render();}
    if(t.dataset.nominateGame){const id=Number(t.dataset.nominateGame);if(nominateAction==='plan')state.game=id;else{const n=nominations.find(n=>n.game===id&&n.activity===1);if(n&&!n.people.includes(1))n.people.push(1);else if(!n)nominations.push({game:id,activity:1,people:[1]});}close();return render();}
    const a=t.dataset.action;
    if(a==='back'){state.page=stack.pop()||'library';close();return render();}
    if(a==='import')return navigate('imports');
    if(['activity','stats','imports','mapping'].includes(a)){state.gameFilter=null;return navigate(a);}
    if(a==='close')return close();
    if(a==='my-inventory'){state.owned=true;return render();}
    if(a==='clear-game-filter'){state.gameFilter=null;return render();}
    if(a==='new-play'||a==='activity-play'){form={...fresh(),game:state.game,activity:a==='activity-play'?1:0};return navigate('editor');}
    if(a==='edit-play'){form=JSON.parse(JSON.stringify(records.find(p=>p.id===state.selectedRecord)));return navigate('editor');}
    if(a==='players'){draftSelection=form.selected.slice();return sheet('选择实际玩家',members.map(m=>`<label class="dr-check"><input type="checkbox" data-person-choice="${m.id}" ${draftSelection.includes(m.id)?'checked':''}><span class="dr-avatar">${m.short}</span><span>${m.name}</span></label>`).join(''),true,button('取消','close')+primary('确认','confirm-players'));}
    if(a==='confirm-players'){if(!draftSelection.length)return error('至少选择一位玩家');if(form.mode==='solo'&&draftSelection.length!==1)return error('单人模式只能选择一位玩家');form.selected=draftSelection;form.selected.forEach(id=>{form.statuses[id]??='unrecorded';form.scores[id]??='';});close();return render();}
    if(a==='save-play'||a==='save-draft')return save(a==='save-draft');
    if(a==='confirm-import'){state.imported=true;return navigate('imports');}
    if(a==='filter')return sheet('筛选桌游',`<label class="dr-check"><input type="checkbox" data-owned ${state.owned?'checked':''}>只看我的馆藏</label><label class="dr-check"><input type="checkbox" data-available ${state.available?'checked':''}>活动可用</label>`,true,button('取消','close')+primary('确认','confirm-filter'));
    if(a==='confirm-filter'){state.owned=overlay.querySelector('[data-owned]').checked;state.available=overlay.querySelector('[data-available]').checked;close();return render();}

  function chooseWinners(){const units=form.mode==='team'?[1,2].map(id=>({id,name:id+' 队',status:form.teamStatuses[id]})):members.filter(m=>form.selected.includes(m.id)).map(m=>({...m,status:form.statuses[m.id]}));sheet('指定赢家',units.map(m=>`<label class="dr-check"><input type="checkbox" data-winner="${m.id}" ${(form.winnerIds||[]).includes(m.id)?'checked':''} ${['gave_up','unfinished','table_flip'].includes(m.status)?'disabled':''}>${m.name}${m.status==='gave_up'?' · 摆烂不能获胜':''}</label>`).join('')+`<label class="dr-field"><span>决胜或更正说明</span><input data-winner-reason placeholder="说明采用的规则" value="${esc(form.resultReason)}"></label>`,true,button('取消','cancel-winners')+primary('确认选择','confirm-winners'));}
  root.addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.action;if(a==='choose-winners')chooseWinners();if(a==='cancel-winners'){form.resultMethod='score';form.winnerIds=[];close();render();}if(a==='confirm-winners'){const ids=[...overlay.querySelectorAll('[data-winner]:checked')].map(t=>Number(t.dataset.winner)),reason=overlay.querySelector('[data-winner-reason]').value.trim();if(!ids.length||!reason)return error('请选择至少一位赢家并填写说明');if(form.resultMethod==='tiebreak'){const values=form.mode==='team'?form.teamScores:form.scores,units=form.mode==='team'?[1,2]:form.selected,known=units.filter(id=>values[id]!=='');if(known.length!==units.length)return error('同分决胜需先补齐可比较的分数');const best=Math.max(...known.map(id=>Number(values[id]))),tied=known.filter(id=>Number(values[id])===best);if(tied.length<2||ids.some(id=>!tied.includes(id)))return error('请从并列最高分中选择赢家');}form.winnerIds=ids;form.resultReason=reason;close();render();}});
  setInterval(()=>{const label=screen.querySelector('[data-timer-value]');if(label&&extra.timerStart)label.textContent=clockText();},1000);

  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'recent',{label:'展示近期馆藏'});tweak.addToggle(state,'checked',{label:'当前用户已打卡'});tweak.addToggle(state,'organizer',{label:'当前用户为活动创建者'});tweak.addToggle(state,'started',{label:'活动已经开始'});}
})();

/* FLOW_SOURCE_END */
</script>
</div>
